appId: io.falang.flow
productName: FalangFlow
executableName: falang-flow
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  - '!**/*.{ts,tsx,map}'
# `backend-dist` (scripts/release/build-flow-backend-dist.ts, the self-contained local-mode backend: a real
# node_modules tree) and the workflow client are built by the `prebuild:*` npm hooks. The backend must be real files
# outside app.asar (run by Node, not by Electron's asar-aware fs); `extraResources` cannot carry a node_modules tree
# (electron-builder always filters it), so `scripts/after-pack.cjs` copies it. ADR 0072 (private).
afterPack: scripts/after-pack.cjs
extraResources:
  - from: ../../workflow/client/dist
    to: client
npmRebuild: false
artifactName: falang-flow-${version}-${arch}.${ext}
# The static update feed (ADR 0050 (private)): with a `generic` provider every build writes its update-info files
# (`latest*.yml`, plus `beta*`/`alpha*` for all channels) next to the artifacts; `scripts/release/feed.ts` uploads
# them to this directory on download.falang.io (a fork builds with its own URL).
publish:
  provider: generic
  url: https://download.falang.io/flow
generateUpdatesFilesForAllChannels: true
linux:
  target: [AppImage, deb]
  category: Development
  maintainer: Falang <noreply@falang.io>
deb:
  packageName: falang-flow
  artifactName: falang-flow_${version}_${arch}.${ext}
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
win:
  target: nsis
nsis:
  artifactName: falang-flow-setup-${version}.${ext}
