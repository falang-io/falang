appId: io.falang.sketch
productName: FalangSketch
executableName: falang-sketch
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  - '!**/*.{ts,tsx,map}'
asarUnpack:
  - resources/**
# The bundled `@falang/desktop-mcp` stdio server (ADR 0029 (private), phase E) — `mcp-server-path.ts`
# runs `<resourcesPath>/mcp-server/index.js` with the app's own binary in Node mode, so it must land
# unpacked at exactly that path. Built by the `prebuild:*` npm hooks below (`npm run build -w
# @falang/desktop-mcp`) before electron-builder runs; not part of this app's own `out/` output.
extraResources:
  - from: ../mcp/dist
    to: mcp-server/index.js
  # The bundled codegen export worker (ADR 0019 (private)'s "Implementation notes (export worker
  # …)") — `resolve-export-worker-command.ts` runs `<resourcesPath>/export-worker/index.js` with the app's own
  # binary in Node mode. Built by this package's own `prebuild:*` npm hooks
  # (`npm run build:export-worker`) before electron-builder runs.
  - from: worker-dist
    to: export-worker/index.js
# File names without spaces: they become URLs in the update feed (ADR 0050 (private)).
artifactName: falang-sketch-${version}-${arch}.${ext}
# Targets per ADR 0050 (private): AppImage updates itself, .deb is a manual download; on macOS the .dmg
# is the download and the .zip is what electron-updater installs (only once the app is signed).
# The static update feed (ADR 0050 (private)): with a `generic` provider every build writes its update-info files
# (`latest*.yml`, plus `beta*`/`alpha*` for all channels) next to the artifacts; `scripts/release/feed.ts` uploads
# them to this directory on download.falang.io (a fork builds with its own URL).
publish:
  provider: generic
  url: https://download.falang.io/sketch
generateUpdatesFilesForAllChannels: true
linux:
  target: [AppImage, deb]
  category: Development
  # Required by the .deb format (the package's Maintainer field).
  maintainer: Falang <noreply@falang.io>
deb:
  packageName: falang-sketch
  artifactName: falang-sketch_${version}_${arch}.${ext}
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
win:
  target: nsis
nsis:
  artifactName: falang-sketch-setup-${version}.${ext}
