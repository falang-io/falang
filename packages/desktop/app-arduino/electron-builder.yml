appId: com.falang.arduino
productName: Falang Arduino
executableName: falang-arduino
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - resources/drivers/**
  - package.json
  - '!**/*.{ts,tsx,map}'
# Pre-bundled device drivers (ADR 0023 (private)) are read from the real filesystem at runtime
# (driver-registry.ts scans the directory, copies source files into the built sketch) — asar's virtual
# fs makes plain reads transparent, but stays unpacked here so relative paths resolved against a
# driver's own folder (sourceFiles/includes) behave identically to the dev filesystem.
asarUnpack:
  - resources/**
# The bundled `@falang/desktop-mcp` stdio server (ADR 0029 (private), phase E) — `mcp-server-path.ts`
# resolves a packaged build's command to `node <resourcesPath>/mcp-server/index.js`, so it must land
# unpacked at exactly that path. Built by the `prebuild:*` npm hooks below (`npm run build -w
# @falang/desktop-mcp`) before electron-builder runs; not part of this app's own `out/` output.
extraResources:
  - from: ../mcp/dist/index.js
    to: mcp-server/index.js
  # The bundled sketch-compile worker (ADR 0020 (private)'s "Implementation notes (compile worker
  # …)") — `resolve-compile-worker-command.ts` resolves a packaged build's command to `node
  # <resourcesPath>/compile-worker/index.js`. Built by this package's own `prebuild:*` npm hooks
  # (`npm run build:compile-worker`) before electron-builder runs.
  - from: worker-dist/index.js
    to: compile-worker/index.js
# No auto-update (matching packages/desktop/app-sketch's offline-first UX — see ADR 0005 (private)).
linux:
  target: AppImage
  category: Development
mac:
  target: dmg
  category: public.app-category.developer-tools
win:
  target: nsis
