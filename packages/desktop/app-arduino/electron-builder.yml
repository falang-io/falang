appId: com.falang.arduino
productName: Falang Arduino
executableName: falang-arduino
directories:
  output: dist
  buildResources: resources
files:
  - out/**/*
  - package.json
  - '!**/*.{ts,tsx,map}'
# The bundled `@falang/desktop-mcp` stdio server (ADR 0029 (private), phase E) — `mcp-server-path.ts`
# runs `<resourcesPath>/mcp-server/index.js` with the app's own binary in Node mode, so it must land
# unpacked at exactly that path. Built by the `prebuild:*` npm hooks below (`npm run build -w
# @falang/desktop-mcp`) before electron-builder runs; not part of this app's own `out/` output.
extraResources:
  # Pre-bundled device drivers (ADR 0023 (private)) — the data of `@falang/desktop-arduino-drivers` (ADR 0051 (private)),
  # read from the real filesystem at runtime (`bundled-drivers-dir.ts` -> `<resourcesPath>/drivers`; the driver registry
  # scans the directory and copies source files into the built sketch). A real directory outside `app.asar`, so the driver
  # folders' relative `sourceFiles`/`includes` paths and the AppImage staging in `mcp-server-path.ts` behave exactly like
  # the dev filesystem.
  - from: ../arduino-drivers/drivers
    to: drivers
  - from: ../mcp/dist
    to: mcp-server/index.js
  # The bundled sketch-compile worker (ADR 0020 (private)'s "Implementation notes (compile worker
  # …)") — `resolve-compile-worker-command.ts` runs `<resourcesPath>/compile-worker/index.js` with the app's own
  # binary in Node mode. Built by this package's own `prebuild:*` npm hooks
  # (`npm run build:compile-worker`) before electron-builder runs.
  - from: worker-dist
    to: compile-worker/index.js
# File names without spaces: they become URLs in the update feed (ADR 0050 (private)).
artifactName: falang-arduino-${version}-${arch}.${ext}
# Targets per ADR 0050 (private): AppImage updates itself, .deb is a manual download; on macOS the .dmg
# is the download and the .zip is what electron-updater installs (only once the app is signed).
linux:
  target: [AppImage, deb]
  category: Development
  # Required by the .deb format (the package's Maintainer field).
  maintainer: Falang <noreply@falang.io>
deb:
  packageName: falang-arduino
  artifactName: falang-arduino_${version}_${arch}.${ext}
mac:
  target: [dmg, zip]
  category: public.app-category.developer-tools
win:
  target: nsis
nsis:
  artifactName: falang-arduino-setup-${version}.${ext}
